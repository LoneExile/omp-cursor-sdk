name: Release

# Publishes to npm when a GitHub Release is published (tag the release with the
# version, e.g. v0.4.0, after the matching "version" is in package.json). Can
# also be run manually via workflow_dispatch to re-fire a flaked publish.
#
# Tokenless: authentication uses npm Trusted Publishing (OIDC) — no NPM_TOKEN.
# The package must exist on npm once before this workflow can publish it, so the
# first version is published by hand:
#   npm login && npm publish --access public
# then, on npmjs.com (package "omp-cursor-sdk" → Settings → Publishing access),
# add a GitHub Actions trusted publisher for repo LoneExile/omp-cursor-sdk,
# workflow filename "release.yml", allowed action "npm publish". Provenance is
# generated automatically.
#
# A version already on npm — including that hand-published first one — is
# skipped, so publishing its GitHub Release stays green. Publish each later
# version either by hand or through this workflow, never both ways for the same
# version.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Check whether this version is already on npm
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already published; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
